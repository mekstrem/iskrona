name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          check-latest: true
          cache: true
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/bin
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            binary="iskrona"
            if [ "$os" = "windows" ]; then binary="${binary}.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/bin/$binary" .
            archive="dist/iskrona_${version}_${os}_${arch}.zip"
            zip -j "$archive" "dist/bin/$binary" README.md LICENSE
          done
          (cd dist && sha256sum ./*.zip > checksums.txt)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
