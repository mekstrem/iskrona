name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Test
        run: go test ./...
      - name: Test dev build
        run: go test -tags dev ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
