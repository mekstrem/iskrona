name: Bug report
description: Report reproducible incorrect behavior in ISKrona.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, private paths, or market data you cannot share."
  - type: input
    id: version
    attributes:
      label: ISKrona version
      description: "Run `iskrona version`."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
